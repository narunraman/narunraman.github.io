<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>Narun Raman</title>
  <link rel="canonical" href="https://www.narunraman.com/photos/">
  <meta name="description" content="Narun's photos">
  <meta name="author" content="Narun Raman">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="/assets/fonts/cmu-bright-500-roman.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

  <link rel="stylesheet" href="/css/custom.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16.png">
  <link rel="shortcut icon" href="../assets/images/favicon-32.png">

  <style>
    :root { --gap: 2px; }
    /* no rubber-band overscroll: the page ends in black, and bouncing past it showed the white behind */
    html, body { overscroll-behavior: none; }
    *, *::before, *::after { box-sizing: border-box; }

    /* Make navbar brand smaller for this page */
    .navbar-brand { font-size: 1rem !important; }

    /* Reduce spacing between navbar and horizontal line */
    .container.mt-5 { margin-top: 1rem !important; }

    hr { margin-top: 0.5rem; margin-bottom: 1rem; }

    /* Full-page splash photo */
    .splash-container {
      position: relative;
      height: calc(100vh - 60px);
      width: 100%;
      overflow: hidden;
      margin-top: 0;
    }
    .splash-photo { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .splash-container::after {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 150px;
      background: linear-gradient(to bottom, white, transparent); pointer-events: none; z-index: 1;
    }
    .splash-container::before {
      content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 210px;
      background: linear-gradient(to top, black, transparent); pointer-events: none; z-index: 1;
    }
    .splash-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      color: white; padding: 2rem; text-align: center;
    }
    .splash-overlay h1 { font-size: 2.5rem; margin-bottom: 1rem; color: white; }

    @media (max-width: 768px) {
      .splash-container { height: calc(100vh - 50px); }
      .splash-overlay h1 { font-size: 2rem; }
      .splash-overlay { padding: 1.5rem; }
    }

    /* Black gallery section */
    .gallery-section {
      background-color: black;
      min-height: 100vh;
      padding: 1rem 0;
      color: white;
      overflow-x: hidden; /* Prevent horizontal scroll */
    }

    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      position: relative;
    }

    .gallery-content { flex: 1; overflow: visible; }

    .gallery-selector { width: 100%; text-align: center; padding: 1rem 0; }
    .gallery-selector h3 { color: white; margin-bottom: 1rem; font-size: 1.2rem; }

    .gallery-options { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 2rem; }
    .gallery-option {
      color: white !important; text-decoration: none !important; font-size: 1rem;
      transition: all 0.3s ease; cursor: pointer; position: relative;
    }
    .gallery-option:hover { color: #dc3545 !important; text-decoration: none !important; }
    .gallery-option.active { color: #dc3545 !important; text-decoration: none !important; }
    .gallery-option.active:hover { color: #dc3545 !important; text-decoration: none !important; }
    .gallery-option.active::after {
      content: ""; position: absolute; bottom: -5px; left: 0; right: 0; height: 2px; background: #dc3545;
    }

    @media (max-width: 768px) {
      .gallery-container { padding: 0 1rem; }
      .gallery-options { gap: 1rem; }
      .gallery-option { font-size: 0.9rem; }
    }
    
    /* === Justified grid (MVP integrated) === */
    .photo-grid {
      width: 100vw;
      margin-left: calc(-50vw + 50%); /* full-bleed centering */
      display: flex;           /* stack rows vertically */
      flex-direction: column;
      row-gap: var(--gap);     /* thin, uniform gap BETWEEN rows */
      line-height: 0;
      font-size: 0;
      padding: 0;
      margin-top: 0 !important;
    }

    .photo-row {
      display: flex;
      gap: var(--gap);         /* thin, uniform gap WITHIN the row */
      align-items: stretch;
      flex-wrap: nowrap;       /* never wrap within a row */
      margin: 0; padding: 0;
    }

    /* IMPORTANT: remove margin-stacking approach; gaps are controlled above */
    /* .photo-row + .photo-row { margin-top: 2px; }  <-- deleted on purpose */

    /* the page ends in black, like the gallery */
    .photos-footer { margin: 0; padding: 1.6rem 0 2.2rem; background: #000; color: #fff; }
    .photos-footer small, .photos-footer a, .photos-footer a::before { color: #fff !important; }
    .photos-footer a:hover, .photos-footer a:hover::before { color: #dc3545 !important; }

    .photo-item { position: relative; overflow: hidden; flex: 0 0 auto; min-width: 0; margin: 0; padding: 0; }
    .photo-item img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* Remove old responsive fixed heights; JS controls heights precisely */
    /* @media (max-width: 768px) { .photo-item { height: 30vw; } }
       @media (max-width: 480px) { .photo-item { height: 35vw; } } */

    #content .photo-grid img,
    #content .photo-row img,
    #content .photo-item img {
    margin: 0 !important;            /* kills the 1rem auto from custom.css */
    display: block;                   /* keep it block to avoid inline gaps */
    }

    /* Ensure rows control spacing, not margins */
    #content .photo-row {
    margin: 0 !important;
    padding: 0 !important;
    gap: 2px !important;              /* thin horizontal gutter */
    }

    /* Same thin vertical gutter between rows */
    #content .photo-grid {
    row-gap: 2px !important;
    line-height: 0;
    font-size: 0;
    }

    /* Hover dim + pointer */
    .photo-item { cursor: pointer; }
    .photo-item img { transition: filter 150ms ease; }
    .photo-item:hover img { filter: brightness(0.75); }

    /* Lightbox/Carousel */
    body.modal-open { overflow: hidden; }
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 10000; }
    .lightbox.open { display: flex; }
    .lightbox-content { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 4rem 5rem; z-index: 1; }
    .lightbox-img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 0 30px rgba(0,0,0,0.35); }
    /* place and month under the photo: small and quiet */
    .lightbox-caption { position: absolute; left: 0; right: 0; bottom: 1.4rem; text-align: center; color: rgba(255,255,255,0.72);
                        font-size: 0.9rem; letter-spacing: 0.02em; pointer-events: none; }
    .lightbox-caption:empty { display: none; }
    /* small spinner at the photo's bottom-right corner while it (or its sharper copy) loads; it only
       appears if loading takes more than a moment, so instant loads don't flash it */
    .lightbox-spinner { position: absolute; width: 20px; height: 20px; border-radius: 50%;
                        border: 2px solid rgba(255,255,255,0.3); border-top-color: rgba(255,255,255,0.95);
                        box-shadow: 0 0 6px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; z-index: 2; }
    .lightbox-spinner.on { animation: lb-spin 0.8s linear infinite, lb-appear 0.2s ease 0.25s forwards; }
    @keyframes lb-spin { to { transform: rotate(360deg); } }
    @keyframes lb-appear { to { opacity: 1; } }
    .lightbox-close, .lightbox-prev, .lightbox-next {
      position: absolute; background: rgba(0,0,0,0.55); border: none; color: #fff;
      width: 44px; height: 44px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 24px; line-height: 1; transition: background 120ms ease;
      z-index: 3; /* Ensure controls are above content */
      pointer-events: auto;
    }
    .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { background: rgba(0,0,0,0.8); }
    .lightbox-close { top: 16px; right: 16px; }
    .lightbox-prev { left: 16px; top: 50%; transform: translateY(-50%); }
    .lightbox-next { right: 16px; top: 50%; transform: translateY(-50%); }

    @media (max-width: 768px) {
      .lightbox-content { padding: 3rem 3.5rem; }
      .lightbox-prev, .lightbox-next { width: 38px; height: 38px; }
    }
  </style>
</head>

  <div id="content">

                sizes="max(100vw, calc((100vh - 60px) * 1.824))">

  <!-- Lightbox / Carousel -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-prev" aria-label="Previous">&#10094;</button>
    <div class="lightbox-content">
      <img class="lightbox-img" alt="Expanded photo">
      <div class="lightbox-caption" aria-live="polite"></div>

  <script>
    
  const galleries = { color: 59, bw: 23};

  // Add base for asset paths so it works on file:// and GitHub Pages
  const ASSETS_BASE = '/assets/photos';
  const IS_FILE = typeof location !== 'undefined' && location.protocol === 'file:';

  // ==== PERF KNOBS ====
  const GAP = 2;
  const MIN_ROW_H = 140, MAX_ROW_H = 380, STEP_H = 8, LAST_ROW_MIN_FILL = 0.65;
  // User-tunable max row height. Change DEFAULT_USER_MAX_ROW_H here or set window.PHOTO_MAX_ROW_H before DOMContentLoaded.
  const DEFAULT_USER_MAX_ROW_H = 140;
  function effectiveMaxRowH() { return Math.min(MAX_ROW_H, window.PHOTO_MAX_ROW_H || DEFAULT_USER_MAX_ROW_H); }
    
  // Cache aspect ratios by src so tab switches are instant after first view
  const arCache = new Map(); // src -> number
  // Originals whose resized copies exist (listed in photo-index.json "dims"; made by generate_thumbnails.fish)
  const HAS_RESIZED = new Set();
  const GRID_2X = 800, THUMB_EDGE = 400, LIGHTBOX_EDGE = 2048, SHARP_EDGE = 3200;
  const ORIG_WH = new Map(); // src -> [width, height] of the original
  const VARIANT_W = new Map(); // src -> {thumb, x2} pixel widths for srcset

  // Manifest of photos (loaded at runtime). GH Pages cannot list directories, so we use a JSON index.
  let PHOTO_INDEX = null, PHOTO_INDEX_PROMISE = null;
  function ensurePhotoIndex() {
    return PHOTO_INDEX_PROMISE || (PHOTO_INDEX_PROMISE = loadPhotoIndex());
  }
  async function loadPhotoIndex() {
    // Firefox blocks fetch() on file://. In file mode, skip fetch and use fallback filenames.
    if (IS_FILE) { PHOTO_INDEX = {}; return PHOTO_INDEX; }
    try {
      const res = await fetch(`${ASSETS_BASE}/photo-index.json`, { cache: 'no-cache' });
      if (res.ok) {
        PHOTO_INDEX = await res.json();
      } else {
        console.warn('photo-index.json not found or not ok:', res.status);
        PHOTO_INDEX = {};
      }
    } catch (e) {
      console.warn('Failed to load photo-index.json', e);
      PHOTO_INDEX = {};
    }
    return PHOTO_INDEX;
  }

  ensurePhotoIndex(); // start fetching the manifest while the rest of the page loads

  function gridWidthPx(el) {
    try {
      let w = el?.clientWidth || el?.getBoundingClientRect?.().width || 0;
      if (!w || w <= 0) {
        const p = el?.parentElement;
        w = p?.clientWidth || p?.getBoundingClientRect?.().width || 0;
      }
      if (!w || w <= 0) {
        w = (typeof window !== 'undefined' && window.innerWidth) ? window.innerWidth : 0;
      }
      w = Math.max(1, Math.floor(w || 0));
      return w;
    } catch (e) {
      console.warn('gridWidthPx failed; using viewport width', e);
      return Math.max(1, Math.floor((typeof window !== 'undefined' ? window.innerWidth : 1024)));
    }
  }

  function sourcesFromIndex(indexObj, galleryType) {
    const list = indexObj?.[galleryType];
    if (Array.isArray(list) && list.length) {
      return list.map(name => `${ASSETS_BASE}/${galleryType}/${name}`);
    }
    return [];
  }

  function fallbackSequentialSources(galleryType) {
    const n = galleries[galleryType] || 0;
    return Array.from({ length: n }, (_, i) => `${ASSETS_BASE}/${galleryType}/photo${i + 1}.jpg`);
  }

  async function sourcesFor(galleryType) {
    const indexObj = await ensurePhotoIndex();
    const fromIndex = sourcesFromIndex(indexObj, galleryType);
    return fromIndex.length ? fromIndex : fallbackSequentialSources(galleryType);
  }

  function toThumb(src) {
    // Insert "/thumbs" after the gallery folder: assets/photos/<gallery>/thumbs/<file>
    try { return src.replace(/(photos\/[^/]+)\//, '$1/thumbs/').replace(/\.jpg$/, '.webp'); } catch { return src; }
  }

  // assets/photos/<gallery>/photoN.jpg -> assets/photos/<gallery>/resized/photoN-<edge>.webp
  function toResized(src, edge) {
    return src.replace(/(photos\/[^/]+)\/([^/]+)\.jpg$/, `$1/resized/$2-${edge}.webp`);
  }

  // Aspect ratios come from the pixel sizes in photo-index.json, so the grid can be laid out
  // before any image is downloaded (previously every full-size original was fetched for this).
  function seedFromIndex(indexObj, galleryType) {
    const dims = indexObj?.dims?.[galleryType];
    if (!dims) return;
    for (const [name, wh] of Object.entries(dims)) {
      const [w, h] = Array.isArray(wh) ? wh : [];
      if (!(w > 0 && h > 0)) continue;
      const src = `${ASSETS_BASE}/${galleryType}/${name}`;
      arCache.set(src, w / h);
      ORIG_WH.set(src, [w, h]);
      HAS_RESIZED.add(src);
      const fit = edge => Math.round(w * Math.min(1, edge / Math.max(w, h)));
      VARIANT_W.set(src, { thumb: fit(THUMB_EDGE), x2: fit(GRID_2X) });
    }
  }

  // Slot width for `sizes`, capped at 2x density: 3x phones get the 800 px images, not originals
  function sizesFor(w) {
    const dpr = window.devicePixelRatio || 1;
    return Math.max(1, Math.round(w * Math.min(1, 2 / dpr))) + 'px';
  }

  // Photo elements are built once per gallery and reused on tab switches and resizes
  const gridCache = new Map(); // galleryType -> photos
  let ACTIVE_GALLERY = 'color';
  let LAST_LAYOUT_W = 0;

  function buildPhotos(galleryType, srcs) {
    const photos = srcs.map((src, i) => {
      const item = document.createElement('div');
      item.className = 'photo-item';
      const img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy'; img.decoding = 'async';
      img.setAttribute('fetchpriority', 'low');
      img.dataset.fullsrc = src;
      img.addEventListener('error', () => {
        if (img.src !== new URL(src, location.href).href) { img.removeAttribute('srcset'); img.src = src; }
      }, { once: true });
      item.appendChild(img);
      item.addEventListener('click', () => openLightbox(i, srcs));
      const ar = arCache.get(src) || null;
      if (ar) item.style.setProperty('--ar', ar);
      return { item, img, ar, full: src };
    });

    // Fallback for photos missing from photo-index.json "dims" (generate_thumbnails.fish not re-run):
    // load their thumbnail now to learn the aspect ratio, then lay out again.
    const missing = photos.filter(p => !p.ar);
    let pending = missing.length;
    missing.forEach(p => {
      const finalize = () => {
        if (!p.ar && p.img.naturalWidth > 0) {
          p.ar = p.img.naturalWidth / p.img.naturalHeight;
          if (isFinite(p.ar) && p.ar > 0) arCache.set(p.full, p.ar); else p.ar = null;
        }
        pending--;
        if (pending <= 0 && ACTIVE_GALLERY === galleryType) layoutActive(true);
      };
      p.img.addEventListener('load', finalize, { once: true });
      p.img.addEventListener('error', finalize, { once: true });
      p.img.loading = 'eager';
      p.img.src = toThumb(p.full);
    });
    if (missing.length) setTimeout(() => { if (ACTIVE_GALLERY === galleryType) layoutActive(true); }, 1600);
    return photos;
  }

  // The rows currently on screen. Rows scale with the window in pure CSS (each photo's flex-grow is
  // its aspect ratio). On a width change the best split is worked out again (it takes about a
  // millisecond) and the page is only rebuilt when the rows come out differently.
  let CURRENT_ROWS = null; // { gallery, rows, targetH }

  function layoutActive(force) {
    const photos = gridCache.get(ACTIVE_GALLERY);
    if (!photos) return;
    const photoGrid = document.getElementById('photo-grid');
    const W = gridWidthPx(photoGrid);
    if (!force && W === LAST_LAYOUT_W) return; // e.g. phone address bar showing/hiding: nothing to redo
    fastLayout(photoGrid, photos.filter(p => typeof p.ar === 'number'));
  }

  async function createPhotoGrid(galleryType) {
    ACTIVE_GALLERY = galleryType;
    let photos = gridCache.get(galleryType);
    if (!photos) {
      const indexObj = await ensurePhotoIndex();
      seedFromIndex(indexObj, galleryType);
      const srcs = await sourcesFor(galleryType);
      photos = gridCache.get(galleryType) || buildPhotos(galleryType, srcs);
      gridCache.set(galleryType, photos);
    }
    if (ACTIVE_GALLERY !== galleryType) return; // another tab was picked meanwhile
    layoutActive(true);
  }

  function fastLayout(container, photos) {
    const W = gridWidthPx(container);
    if (W <= 0 || photos.length === 0) return;

    // Use cached ARs to pick h immediately
    const ars = photos.map(p => p.ar);
    const best = pickOptimalTargetHeight(ars, W);
    renderJustified(container, photos, W, best.h, true);
    LAST_LAYOUT_W = W;
  }

  function pickOptimalTargetHeight(ars, W) {
    let best = { h: MIN_ROW_H, bad: Infinity };
    const maxH = effectiveMaxRowH();
    for (let h = MIN_ROW_H; h <= maxH; h += STEP_H) {
      const rows = simulateRows(ars, W, h);
      const last = rows[rows.length - 1];
      const lastWidth = last.sumAR * h + GAP * Math.max(0, last.len - 1);
      const fill = Math.min(lastWidth / W, 1);
      let bad = (1 - fill) ** 2;
      if (fill < LAST_ROW_MIN_FILL) bad += 0.15 * (LAST_ROW_MIN_FILL - fill) ** 2;
      bad += 0.00002 * (h - 260) ** 2;
      if (bad < best.bad) best = { h, bad };
    }
    return best;
  }

  function simulateRows(ars, W, h) {
    const rows = [];
    let start = 0, sumAR = 0, len = 0;
    for (let i = 0; i < ars.length; i++) {
      const nextSum = sumAR + ars[i];
      const nextLen = len + 1;
      const nextWidth = nextSum * h + GAP * Math.max(0, nextLen - 1);
      if (nextWidth > W && len > 0) {
        rows.push({ start, end: i - 1, sumAR, len });
        start = i; sumAR = ars[i]; len = 1;
      } else { sumAR = nextSum; len = nextLen; }
    }
    rows.push({ start, end: ars.length - 1, sumAR, len });
    return rows;
  }

  // Break the photos into rows so that EVERY row, the last one included, fills the width: of all the
  // ways to split them (in order), take the one whose row heights stay closest to the target. A row
  // is never shorter than the target (as before), and nothing is left over for a ragged last line.
  function partitionRows(ars, W, target) {
    const n = ars.length;
    const cost = new Array(n + 1).fill(Infinity), from = new Array(n + 1).fill(0);
    cost[0] = 0;
    for (let end = 1; end <= n; end++) {
      let sumAR = 0;
      for (let start = end - 1; start >= 0; start--) {
        sumAR += ars[start];
        const len = end - start;
        const h = (W - GAP * (len - 1)) / sumAR;
        if (h < target * 0.99 && len > 1) break; // more photos would only make the row shorter
        // a lone very wide photo may come out shorter than the target: allowed, but costly
        const c = cost[start] + (h >= target ? (h - target) ** 2 : 4 * (target - h) ** 2);
        if (c < cost[end]) { cost[end] = c; from[end] = start; }
      }
    }
    const rows = [];
    for (let end = n; end > 0; end = from[end]) {
      const start = from[end];
      let sumAR = 0;
      for (let k = start; k < end; k++) sumAR += ars[k];
      rows.unshift({ start, end: end - 1, sumAR, len: end - start });
    }
    return rows;
  }

  function renderJustified(containerEl, photos, W, targetH, fillLastRow) {
    const frag = document.createDocumentFragment();
    containerEl.style.rowGap = GAP + 'px';

    const ars = photos.map(p => p.ar);
    const rows = fillLastRow ? partitionRows(ars, W, targetH) : simulateRows(ars, W, targetH);

    // Same rows as on screen already? Then CSS has scaled them; keep the DOM as it is.
    const sig = rows.map(r => `${r.start}-${r.end}`).join(',') + `|${fillLastRow}`;
    if (CURRENT_ROWS && CURRENT_ROWS.gallery === ACTIVE_GALLERY && CURRENT_ROWS.sig === sig &&
        containerEl.childElementCount === rows.length) {
      CURRENT_ROWS.targetH = targetH;
      return;
    }

    rows.forEach((row, idx) => {
      const isLast = idx === rows.length - 1;
      const rowDiv = document.createElement('div');
      rowDiv.className = 'photo-row';
      rowDiv.style.gap = GAP + 'px';

      const gaps = GAP * Math.max(0, row.len - 1);
      // Height we will use for this row
      let h = (!isLast || fillLastRow)
        ? (W - gaps) / row.sumAR  // justified row fills width
        : targetH;                // ragged last row uses target height approximation

      const rowItems = photos.slice(row.start, row.end + 1);

      let widths = [];
      if (!isLast || fillLastRow) {
        // Justify: compute ideal raw widths and distribute rounding delta across ALL items
        const raw = rowItems.map(p => p.ar * h);
        widths = raw.map(r => Math.round(r));
        let total = widths.reduce((a,b) => a + b, 0) + gaps;
        let delta = W - total; // pixels to add (positive) or remove (negative) including gaps
        if (delta !== 0) {
          // Work only on image widths (exclude gaps) so adjust comparing sum(widths)+gaps
          // Build list with fractional parts for fair distribution
          const frac = raw.map((r,i) => ({ i, frac: r - Math.floor(r) }));
          frac.sort((a,b) => delta > 0 ? (b.frac - a.frac) : (a.frac - b.frac));
          let j = 0;
          while (delta !== 0 && j < frac.length * 4) { // guard loop
            const idxAdj = frac[j % frac.length].i;
            const adjust = delta > 0 ? 1 : -1;
            widths[idxAdj] += adjust;
            delta -= adjust;
            j++;
          }
          // Final safety: if still off due to rounding extremes, push remainder into last item
          if (delta !== 0) widths[widths.length - 1] += delta;
        }
      } else {
        // Ragged last row: no justification, preserve aspect ratios
        widths = rowItems.map(p => Math.round(p.ar * h));
      }

      const fluid = !isLast || fillLastRow;
      rowItems.forEach((p, j) => {
        const w = Math.max(1, widths[j]);
        if (fluid) {
          // width proportional to the photo's shape, height from its aspect ratio: the row
          // rescales smoothly with the window without any script
          // (x100: flex-grow values summing to under 1 would leave part of the row empty)
          p.item.style.flex = `${p.ar * 100} 1 0px`;
          p.item.style.aspectRatio = String(p.ar);
          p.item.style.width = '';
          p.item.style.height = '';
        } else {
          // ragged last row: its natural size, shrinking in proportion if the window narrows
          p.item.style.flex = `0 1 ${w}px`;
          p.item.style.aspectRatio = String(p.ar);
          p.item.style.width = '';
          p.item.style.height = '';
        }
        const vw = VARIANT_W.get(p.full);
        if (vw) {
          p.img.sizes = sizesFor(w);
          if (!p.img.getAttribute('srcset')) {
            p.img.srcset = `${toThumb(p.full)} ${vw.thumb}w, ${toResized(p.full, GRID_2X)} ${vw.x2}w`;
          }
        }
        if (!p.img.getAttribute('src')) p.img.src = toThumb(p.full);
        rowDiv.appendChild(p.item);
      });

      frag.appendChild(rowDiv);
    });

    containerEl.innerHTML = '';
    containerEl.appendChild(frag);
    CURRENT_ROWS = { gallery: ACTIVE_GALLERY, rows, targetH, sig };
  }

  // After a resize settles, tell the browser each photo's new display width (picks 400 vs 800 px)
  function refreshSizes() {
    (gridCache.get(ACTIVE_GALLERY) || []).forEach(p => {
      if (p.img.getAttribute('srcset')) p.img.sizes = sizesFor(p.item.getBoundingClientRect().width);
    });
  }

  function switchGallery(galleryType) {
    document.querySelectorAll('.gallery-option').forEach(o => o.classList.remove('active'));
    document.querySelector(`[data-gallery="${galleryType}"]`).classList.add('active');
    createPhotoGrid(galleryType);
  }

  // Lightbox state
  let LB_SOURCES = [];
  let LB_INDEX = 0;
  let LB_EL, LB_IMG, LB_BTN_PREV, LB_BTN_NEXT, LB_BTN_CLOSE;

  function openLightbox(startIndex, sources) {
    if (!sources || !sources.length) return;
    LB_SOURCES = sources;
    LB_INDEX = Math.max(0, Math.min(startIndex, sources.length - 1));
    if (!LB_EL) return;
    document.body.classList.add('modal-open');
    LB_EL.classList.add('open');            // shown first, so the photo's size can be measured
    LB_EL.setAttribute('aria-hidden', 'false');
    updateLightboxImage();
    document.addEventListener('keydown', onLightboxKey);
  }

  function closeLightbox() {
    if (!LB_EL) return;
    LB_EL.classList.remove('open');
    LB_EL.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    document.removeEventListener('keydown', onLightboxKey);
  }

  function onLightboxKey(e) {
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') nextImage();
    else if (e.key === 'ArrowLeft') prevImage();
  }

  function nextImage() {
    if (!LB_SOURCES.length) return;
    LB_INDEX = (LB_INDEX + 1) % LB_SOURCES.length;
    updateLightboxImage();
  }

  function prevImage() {
    if (!LB_SOURCES.length) return;
    LB_INDEX = (LB_INDEX - 1 + LB_SOURCES.length) % LB_SOURCES.length;
    updateLightboxImage();
  }

  // Lightbox shows the 2048 px copy; the full-size original is only used if that copy is missing
  function lightboxSrc(src) { return HAS_RESIZED.has(src) ? toResized(src, LIGHTBOX_EDGE) : src; }

  // Caption for the full-screen view: "Place · Month Year". The month is in photo-index.json (from the
  // photo's EXIF data); places are hand-written in assets/photos/places.json. Either may be missing.
  let PLACES_PROMISE = null;
  function loadPlaces() {
    if (!PLACES_PROMISE) {
      PLACES_PROMISE = fetch('/assets/photos/places.json', { cache: 'no-cache' })
        .then(r => (r.ok ? r.json() : {})).catch(() => ({}));
    }
    return PLACES_PROMISE;
  }
  async function captionFor(src) {
    const m = src.match(/photos\/([^/]+)\/([^/]+\.jpg)$/);
    if (!m) return '';
    const [index, places] = await Promise.all([ensurePhotoIndex(), loadPlaces()]);
    const taken = index && index.dates && index.dates[m[1]] && index.dates[m[1]][m[2]];
    let when = '';
    if (taken) {
      const [y, mo] = taken.split('-').map(Number);
      when = new Date(y, mo - 1, 1).toLocaleString('en', { month: 'long', year: 'numeric' });
    }
    const where = (places && places[m[1]] && places[m[1]][m[2]]) || '';
    return [where, when].filter(Boolean).join(' \u00b7 ');
  }

  // The photo is shown at a size worked out here (fit to the screen, never larger than the original),
  // so the 2048 px copy and the sharper 3200 px copy take exactly the same space when one replaces the
  // other, and the spinner can sit at the photo's corner before anything has loaded.
  let LB_TOKEN = 0;
  function lightboxRect(full) {
    const c = LB_EL.querySelector('.lightbox-content');
    const cs = getComputedStyle(c);
    const padL = parseFloat(cs.paddingLeft), padT = parseFloat(cs.paddingTop);
    const cw = c.clientWidth - padL - parseFloat(cs.paddingRight);
    const ch = c.clientHeight - padT - parseFloat(cs.paddingBottom);
    const [ow, oh] = ORIG_WH.get(full) || [LB_IMG.naturalWidth || 3, LB_IMG.naturalHeight || 2];
    const scale = Math.min(cw / ow, ch / oh, 1);
    const w = ow * scale, h = oh * scale;
    return { left: padL + (cw - w) / 2, top: padT + (ch - h) / 2, w, h };
  }
  function layoutLightbox(full) {
    const r = lightboxRect(full);
    LB_IMG.style.width = `${Math.round(r.w)}px`;
    LB_IMG.style.height = `${Math.round(r.h)}px`;
    const sp = LB_EL.querySelector('.lightbox-spinner');
    if (sp) { sp.style.left = `${r.left + r.w - 32}px`; sp.style.top = `${r.top + r.h - 32}px`; }
    return r;
  }
  function needsSharp(full, r) {
    const wh = ORIG_WH.get(full);
    if (!wh || !HAS_RESIZED.has(full) || Math.max(...wh) <= LIGHTBOX_EDGE) return false;
    return Math.max(r.w, r.h) * (window.devicePixelRatio || 1) > LIGHTBOX_EDGE * 1.1;
  }
  function setSpinner(on) {
    const sp = LB_EL && LB_EL.querySelector('.lightbox-spinner');
    if (sp) sp.classList.toggle('on', on);
  }

  function updateLightboxImage() {
    if (!LB_IMG) return;
    const full = LB_SOURCES[LB_INDEX];
    const token = ++LB_TOKEN;
    const cap = LB_EL && LB_EL.querySelector('.lightbox-caption');
    if (cap) {
      cap.textContent = '';
      captionFor(full).then(text => { if (LB_SOURCES[LB_INDEX] === full) cap.textContent = text; });
    }
    const r = layoutLightbox(full);
    setSpinner(true);
    LB_IMG.setAttribute('fetchpriority', 'high');
    LB_IMG.onerror = () => {
      LB_IMG.onerror = null;
      if (LB_IMG.src !== new URL(full, location.href).href) LB_IMG.src = full;
      else setSpinner(false);
    };
    LB_IMG.onload = () => {
      if (token !== LB_TOKEN) return;
      LB_IMG.onload = null;
      if (!needsSharp(full, r)) { setSpinner(false); return; }
      // the screen can show more than 2048 px: fetch the sharper copy, swap it in once decoded
      const sharp = new Image();
      sharp.decoding = 'async';
      sharp.src = toResized(full, SHARP_EDGE);
      sharp.decode().then(() => {
        if (token === LB_TOKEN) LB_IMG.src = sharp.src;
      }).catch(() => {}).finally(() => { if (token === LB_TOKEN) setSpinner(false); });
    };
    LB_IMG.src = lightboxSrc(full);
    preloadNeighborImages();
  }

  function preloadNeighborImages() {
    if (!LB_SOURCES || !LB_SOURCES.length) return;
    const next = LB_SOURCES[(LB_INDEX + 1) % LB_SOURCES.length];
    const prev = LB_SOURCES[(LB_INDEX - 1 + LB_SOURCES.length) % LB_SOURCES.length];
    [next, prev].forEach(src => { const im = new Image(); im.decoding = 'async'; im.loading = 'eager'; im.src = lightboxSrc(src); });
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Lightbox element refs + events
    LB_EL = document.getElementById('lightbox');
    if (LB_EL) {
      LB_IMG = LB_EL.querySelector('.lightbox-img');
      LB_BTN_PREV = LB_EL.querySelector('.lightbox-prev');
      LB_BTN_NEXT = LB_EL.querySelector('.lightbox-next');
      LB_BTN_CLOSE = LB_EL.querySelector('.lightbox-close');

      LB_BTN_PREV && LB_BTN_PREV.addEventListener('click', prevImage);
      LB_BTN_NEXT && LB_BTN_NEXT.addEventListener('click', nextImage);
      LB_BTN_CLOSE && LB_BTN_CLOSE.addEventListener('click', closeLightbox);
      // Click outside image closes
      LB_EL.addEventListener('click', (e) => { if (e.target === LB_EL) closeLightbox(); });
      window.addEventListener('resize', () => { if (LB_EL.classList.contains('open') && LB_SOURCES.length) layoutLightbox(LB_SOURCES[LB_INDEX]); });
      // Basic swipe
      let startX = 0;
      LB_EL.addEventListener('touchstart', e => { startX = (e.changedTouches?.[0]?.clientX) || 0; }, { passive: true });
      LB_EL.addEventListener('touchend', e => {
        const dx = ((e.changedTouches?.[0]?.clientX) || 0) - startX;
        if (Math.abs(dx) > 40) { if (dx < 0) nextImage(); else prevImage(); }
      }, { passive: true });
    }

    // Initial gallery + tab switching
    try { createPhotoGrid('color'); } catch (e) { console.error('createPhotoGrid failed', e); }
    document.querySelectorAll('.gallery-option').forEach(option => {
      option.addEventListener('click', e => {
        e.preventDefault();
        switchGallery(option.getAttribute('data-gallery'));
      });
    });

    // Re-justify only when the grid width changes (not on height-only resizes such as a phone's
    // address bar collapsing while scrolling)
    let frame = 0, settle;
    window.addEventListener('resize', () => {
      if (!frame) frame = requestAnimationFrame(() => { frame = 0; layoutActive(false); });
      clearTimeout(settle);
      settle = setTimeout(refreshSizes, 250);
    });
  });
  </script>

</body>
</html>
