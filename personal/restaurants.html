<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Narun Raman · Restaurants</title>
    <meta name="description" content="Places Narun would send you to eat, on a map.">
    <meta name="author" content='Narun Raman'>
    <link rel="canonical" href="https://www.narunraman.com/personal/restaurants.html">

    <link rel="preload" href="/assets/fonts/cmu-bright-500-roman.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/vendor/bootstrap-4.5.3.min.css">
    <link rel="stylesheet" href="/css/vendor/leaflet-1.9.4.min.css">

    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="/css/restaurants.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16.png">
    <link rel="shortcut icon" href="../assets/images/favicon-32.png">
</head>

<body class="restaurants-page">
    <div class="container-fluid edge-bar">
        <nav class="navbar navbar-expand-sm flex-column flex-sm-row text-nowrap p-0">
            <a class="navbar-brand mx-0 mr-sm-auto" href="/" title="Narun Raman">Narun Raman</a>
            <div class="navbar-nav flex-row flex-wrap justify-content-center">
                <a class="nav-item nav-link" href="/posts" title="Writing">Writing</a>
                <span class="nav-item navbar-text mx-1">/</span>
                <a class="nav-item nav-link" href="/software" title="Software">Software</a>
                <span class="nav-item navbar-text mx-1">/</span>
                <a class="nav-item nav-link" href="/personal" title="Personal">Personal</a>
            </div>
        </nav>
    </div>

    <main class="rmap">
        <div class="rmap-stage">
            <div id="rmap" class="rmap-map" role="application" aria-label="Map of restaurants"></div>
            <aside class="rmap-side">
                <section class="rmap-panel" aria-label="Find a place">
                    <div class="rmap-search-wrap">
                        <input type="search" class="rmap-search" placeholder="Search places, food, cities"
                               aria-label="Search places" autocomplete="off" spellcheck="false">
                        <ul class="rmap-results" role="listbox" hidden></ul>
                    </div>
                    <div class="rmap-meals" role="group" aria-label="Meal"></div>
                    <nav class="rmap-cities" aria-label="Jump to a city"></nav>
                    <div class="rmap-count" aria-live="polite"></div>
                </section>
                <article class="rmap-card" hidden aria-live="polite">
                    <button type="button" class="rmap-close" aria-label="Close">×</button>
                    <div class="rmap-card-body"></div>
                </article>
            </aside>
        </div>

        <noscript><p class="container">This page is a map and needs JavaScript.</p></noscript>
    </main>

    <script src="/js/vendor/leaflet-1.9.4.min.js"></script>
    <script src="/js/restaurants.js"></script>
</body>
</html>
