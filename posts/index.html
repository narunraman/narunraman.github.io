  <link rel="stylesheet" href="/css/custom.css">

  <style>
    :root { --text: #111; --muted: #6c757d; --link: #dc3545; }
    *, *::before, *::after { box-sizing: border-box; }
    body { color: var(--text); font-family: "Open Sans", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }

    /* Navbar: match site */
    .navbar-brand { font-size: 1rem !important; }
    .container.mt-5 { margin-top: 1rem !important; }

    a { color: var(--link); }
    a:hover { color: #b02a37; text-decoration: none; }

    /* Editorial post index */
    .posts-wrap { max-width: 750px; margin: 2rem auto 4rem; padding: 0 1rem; }

    .featured-post { padding-bottom: 2.25rem; border-bottom: 1px solid rgba(0, 0, 0, 0.12); }
    .featured-image { display: block; position: relative; overflow: hidden; }
    .featured-image img { display: block; width: 100%; height: 100%; aspect-ratio: 16 / 7; object-fit: cover; }
    .featured-image::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, #fff 0, rgba(255, 255, 255, 0) 20%, rgba(255, 255, 255, 0) 80%, #fff 100%), linear-gradient(to right, #fff 0, rgba(255, 255, 255, 0) 16%, rgba(255, 255, 255, 0) 84%, #fff 100%); pointer-events: none; }
    .featured-copy { margin-top: 1.25rem; }
    .featured-kicker, .archive-heading { color: var(--muted); font-family: Inconsolata, ui-monospace, monospace; font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .featured-title { --title-default-size: clamp(1.65rem, 3.5vw, 2.25rem); font-family: "CMU Bright", "CMU Serif", Georgia, serif; font-size: var(--title-size, var(--title-default-size)); line-height: 1.12; margin: 0 0 .55rem; }
    .featured-kicker { margin: 0 0 .75rem; }
    .featured-title a { color: inherit; text-decoration: none; }
    .featured-title a:hover { text-decoration: underline; }
    .featured-excerpt { line-height: 1.6; margin: .75rem 0 1rem; }
    .featured-action { display: flex; justify-content: flex-end; margin-top: 1.25rem; }
    .read-link { font-weight: 700; text-decoration: none; }
    .archive { margin-top: 2rem; }
    .archive-heading { margin: 0 0 .5rem; }

    .posts-list { list-style: none; padding: 0; margin: 0; }
    .post-item { display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 1rem; padding: 1rem 0; }

    .post-title { font-size: 1.15rem; margin: 0 0 0.3rem; line-height: 1.3; }
    .post-title a { color: inherit; text-decoration: none; }
    .post-title a:hover { text-decoration: underline; }

    .meta { color: var(--muted); font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; }
    .meta .dot::before { content: "·"; margin: 0 0.35rem; color: var(--muted); }
    .tags { display: inline-flex; gap: 0.5rem; }
    .tag { color: var(--muted); font-size: 0.85rem; }

    .archive-date { color: var(--muted); font-size: .9rem; padding-top: .15rem; white-space: nowrap; }
    .post-item { border-bottom: 1px solid rgba(0, 0, 0, 0.08); }

    @media (max-width: 576px) {
      .featured-image img { aspect-ratio: 16 / 10; }
      .post-item { grid-template-columns: 1fr; gap: .25rem; }
      .archive-date { padding-top: 0; }
      .post-title { font-size: 1.1rem; }
    }
  </style>
</head>
